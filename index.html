<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Werkstatt Wetter</title>

  <!-- Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    .widget {
      width: 100%;
      max-width: 320px;
      background: #fff;
      border-top: 3px solid #FEDD00;
      padding: 14px 16px 10px;
      position: relative;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #111;
      margin-bottom: 12px;
    }

    .search {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .search input {
      flex: 1;
      border: 1px solid #ddd;
      padding: 8px 10px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }

    .search input:focus {
      border-color: #FEDD00;
    }

    .search button {
      background: #111;
      color: white;
      border: none;
      padding: 8px 10px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }

    .search button:hover {
      background: #222;
    }

    .suggestions {
      display: none;
      border: 1px solid #ddd;
      background: white;
      margin-bottom: 10px;
    }

    .suggestion {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background: #fafafa;
    }

    .suggestion strong {
      display: block;
      font-size: 11px;
      font-weight: 700;
    }

    .suggestion span {
      font-size: 10px;
      color: #666;
    }

    .location {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .temp {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
    }

    .details {
      font-size: 10px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .hint {
      border-left: 3px solid #FEDD00;
      background: #fafafa;
      padding: 10px;
      margin-bottom: 12px;
    }

    .hint h3 {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hint p {
      font-size: 10px;
      color: #555;
      line-height: 1.4;
    }

    .forecast {
      border-top: 1px solid #eee;
      margin-top: 6px;
    }

    .forecast-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 11px;
    }

    .forecast-item:last-child {
      border-bottom: none;
    }

    .error {
      display: none;
      font-size: 10px;
      color: #b00000;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="widget">

  <div class="widget-title">
    Werkstatt Wetter
  </div>

  <div class="search">
    <input
      type="text"
      id="cityInput"
      placeholder="Ort eingeben"
      autocomplete="off"
      oninput="searchSuggestions()"
      onkeydown="handleEnter(event)"
    >

    <button onclick="loadWeather()">
      Suchen
    </button>
  </div>

  <div class="suggestions" id="suggestions"></div>

  <div class="error" id="errorBox"></div>

  <div class="location" id="location">
    München
  </div>

  <div class="temp" id="temp">
    --°
  </div>

  <div class="details" id="details">
    Lade Wetterdaten...
  </div>

  <div class="hint" id="hintBox">
    <h3 id="hintTitle">
      Reifen-Hinweis
    </h3>

    <p id="hintText"></p>
  </div>

  <div class="forecast" id="forecast"></div>

</div>

<script>

let suggestionResults = [];
let debounceTimer = null;

function handleEnter(event) {
  if (event.key === "Enter") {
    loadWeather();
  }
}

function showError(message) {
  const box = document.getElementById("errorBox");
  box.innerText = message;
  box.style.display = "block";
}

function hideError() {
  const box = document.getElementById("errorBox");
  box.style.display = "none";
}

async function searchSuggestions() {

  clearTimeout(debounceTimer);

  debounceTimer = setTimeout(async () => {

    const city =
      document.getElementById("cityInput").value.trim();

    const box =
      document.getElementById("suggestions");

    if (city.length < 2) {
      box.style.display = "none";
      box.innerHTML = "";
      return;
    }

    try {

      const url =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=8&language=de&format=json`;

      const res = await fetch(url);
      const data = await res.json();

      suggestionResults = data.results || [];

      if (!suggestionResults.length) {
        box.style.display = "none";
        return;
      }

      box.innerHTML =
        suggestionResults.map((place, index) => `

          <div class="suggestion"
               onclick="selectSuggestion(${index})">

            <strong>
              ${place.name}
            </strong>

            <span>
              ${place.admin1 || ""}
              ${place.country ? ", " + place.country : ""}
            </span>

          </div>

        `).join("");

      box.style.display = "block";

    } catch (error) {

      box.style.display = "none";

    }

  }, 300);
}

function selectSuggestion(index) {

  const place = suggestionResults[index];

  document.getElementById("cityInput").value =
    `${place.name}${place.admin1 ? ", " + place.admin1 : ""}`;

  document.getElementById("suggestions").style.display = "none";

  loadWeatherByPlace(place);
}

async function loadWeather() {

  hideError();

  const city =
    document.getElementById("cityInput").value.trim() || "München";

  const geoUrl =
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=10&language=de&format=json`;

  const geoRes = await fetch(geoUrl);
  const geoData = await geoRes.json();

  if (!geoData.results || !geoData.results.length) {

    showError("Ort nicht gefunden.");

    return;
  }

  const place =
    geoData.results.find(p => p.country_code === "DE")
    || geoData.results[0];

  loadWeatherByPlace(place);
}

async function loadWeatherByPlace(place) {

  const lat = place.latitude;
  const lon = place.longitude;

  document.getElementById("location").innerText =
    `${place.name}${place.admin1 ? ", " + place.admin1 : ""}`;

  const weatherUrl =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,rain,snowfall,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3`;

  const res = await fetch(weatherUrl);
  const data = await res.json();

  const current = data.current;

  document.getElementById("temp").innerText =
    `${Math.round(current.temperature_2m)}°`;

  document.getElementById("details").innerText =
    `Regen: ${current.rain} mm · Schnee: ${current.snowfall} mm · Wind: ${Math.round(current.wind_speed_10m)} km/h`;

  const hintTitle =
    document.getElementById("hintTitle");

  const hintText =
    document.getElementById("hintText");

  if (current.snowfall > 0 || current.temperature_2m <= 3) {

    hintTitle.innerText =
      "❄️ Winterreifen empfohlen";

    hintText.innerText =
      "Kälte oder Schnee: Winterreifen bieten mehr Grip und Sicherheit.";

  } else if (current.temperature_2m < 7) {

    hintTitle.innerText =
      "⚠️ Unter 7°C";

    hintText.innerText =
      "Winterreifen bleiben bei niedrigen Temperaturen flexibler.";

  } else if (current.rain > 0) {

    hintTitle.innerText =
      "🌧️ Aquaplaning-Risiko";

    hintText.innerText =
      "Bei Regen auf Profiltiefe und Reifendruck achten.";

  } else {

    hintTitle.innerText =
      "☀️ Sommerreifen passend";

    hintText.innerText =
      "Gute Bedingungen für Sommerreifen.";

  }

  const forecast =
    document.getElementById("forecast");

  forecast.innerHTML = "";

  data.daily.time.forEach((day, index) => {

    const date =
      new Date(day).toLocaleDateString("de-DE", {
        weekday: "short"
      });

    forecast.innerHTML += `

      <div class="forecast-item">

        <span>${date}</span>

        <strong>
          ${Math.round(data.daily.temperature_2m_min[index])}°
          /
          ${Math.round(data.daily.temperature_2m_max[index])}°
        </strong>

      </div>

    `;
  });
}

loadWeather();

</script>

</body>
</html>
