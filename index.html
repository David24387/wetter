<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Werkstatt Wetter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: none;
    }

    .header {
      padding: 30px 25px;
      background: linear-gradient(to right, #144c9f, #0c7ac5);
      width: 100%;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 5px;
      color: #FFF;
    }

    .header p {
      color: #FFF;
      font-size: 17px;
    }

    .content {
      padding: 0px;
    }

    .search,
    .weather,
    .hint,
    .forecast {
  margin: 20px;
}
    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      position: relative;
    }

    .search input {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
    }

    .search button {
      padding: 14px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      background: black;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .suggestions {
      display: none;
      margin-bottom: 20px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .suggestion {
      padding: 12px 14px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }

    .suggestion:last-child {
      border-bottom: none;
    }

    .suggestion:hover {
      background: #f3f3f3;
    }

    .suggestion strong {
      display: block;
    }

    .suggestion span {
      font-size: 13px;
      color: #666;
    }

    .weather {
      background: #fafafa;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .temp {
      font-size: 64px;
      font-weight: bold;
      margin: 10px 0;
    }

    .small {
      color: #666;
      margin-top: 5px;
    }

    .hint {
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 2px solid;
    }

    .summer {
      background: #fff8d8;
      border-color: #f6c400;
    }

    .winter {
      background: #e8f2ff;
      border-color: #4aa3ff;
    }

    .rain {
      background: #eef8ff;
      border-color: #5daeff;
    }

    .forecast {
      background: #fafafa;
      border-radius: 20px;
      overflow: hidden;
    }

    .forecast-item {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    .forecast-item:last-child {
      border-bottom: none;
    }

    .error {
      display: none;
      background: #fff0f0;
      color: #a10000;
      border: 1px solid #ffcccc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 14px;
    }

  </style>
</head>
<body>

<div class="card">

  <div class="header">
    <h1>Werkstatt Wetter</h1>
    <p>Wetter + Reifenempfehlung</p>
  </div>

  <div class="content">

    <div class="search">
      <input
        type="text"
        id="cityInput"
        placeholder="Ort eingeben, z. B. Frankfurt"
        autocomplete="off"
        oninput="searchSuggestions()"
        onkeydown="handleEnter(event)"
      >
      <button onclick="loadWeather()">Suchen</button>
    </div>

    <div class="suggestions" id="suggestions"></div>
    <div class="error" id="errorBox"></div>

    <div class="weather">
      <div id="location">München</div>
      <div class="temp" id="temp">--°</div>
      <div class="small" id="details">Lade Wetterdaten...</div>
    </div>

    <div class="hint" id="hintBox">
      <h3 id="hintTitle">Reifen-Hinweis</h3>
      <p id="hintText"></p>
    </div>

    <div class="forecast" id="forecast"></div>

  </div>

</div>

<script>
let suggestionResults = [];
let debounceTimer = null;

function showError(message) {
  const errorBox = document.getElementById("errorBox");
  errorBox.innerText = message;
  errorBox.style.display = "block";
}

function hideError() {
  const errorBox = document.getElementById("errorBox");
  errorBox.innerText = "";
  errorBox.style.display = "none";
}

function handleEnter(event) {
  if (event.key === "Enter") {
    loadWeather();
  }
}

async function searchSuggestions() {
  clearTimeout(debounceTimer);

  debounceTimer = setTimeout(async () => {
    const city = document.getElementById("cityInput").value.trim();
    const suggestionsBox = document.getElementById("suggestions");

    if (city.length < 2) {
      suggestionsBox.style.display = "none";
      suggestionsBox.innerHTML = "";
      suggestionResults = [];
      return;
    }

    try {
      const geoUrl =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=8&language=de&format=json`;

      const geoRes = await fetch(geoUrl);
      const geoData = await geoRes.json();

      suggestionResults = geoData.results || [];

      if (suggestionResults.length === 0) {
        suggestionsBox.style.display = "none";
        suggestionsBox.innerHTML = "";
        return;
      }

      suggestionsBox.innerHTML = suggestionResults.map((place, index) => {
        const admin = place.admin1 ? `, ${place.admin1}` : "";
        const country = place.country ? `, ${place.country}` : "";
        const extra = `${admin}${country}`;

        return `
          <div class="suggestion" onclick="selectSuggestion(${index})">
            <strong>${place.name}</strong>
            <span>${extra || "Standort auswählen"}</span>
          </div>
        `;
      }).join("");

      suggestionsBox.style.display = "block";
    } catch (error) {
      suggestionsBox.style.display = "none";
      suggestionsBox.innerHTML = "";
    }
  }, 300);
}

function selectSuggestion(index) {
  const place = suggestionResults[index];

  if (!place) return;

  const label =
    `${place.name}${place.admin1 ? ", " + place.admin1 : ""}${place.country ? ", " + place.country : ""}`;

  document.getElementById("cityInput").value = label;
  document.getElementById("suggestions").style.display = "none";

  loadWeatherByPlace(place);
}

async function findBestPlace(city) {
  const geoUrl =
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=10&language=de&format=json`;

  const geoRes = await fetch(geoUrl);
  const geoData = await geoRes.json();

  if (!geoData.results || geoData.results.length === 0) {
    return null;
  }

  const germanPlace = geoData.results.find(place => place.country_code === "DE");
  return germanPlace || geoData.results[0];
}

async function loadWeather() {
  hideError();

  const city = document.getElementById("cityInput").value.trim() || "München";
  const suggestionsBox = document.getElementById("suggestions");
  suggestionsBox.style.display = "none";

  try {
    const place = await findBestPlace(city);

    if (!place) {
      showError("Ort nicht gefunden.");
      return;
    }

    await loadWeatherByPlace(place);
  } catch (error) {
    showError("Wetterdaten konnten nicht geladen werden.");
  }
}

async function loadWeatherByPlace(place) {
  hideError();

  const lat = place.latitude;
  const lon = place.longitude;

  const label =
    `${place.name}${place.admin1 ? ", " + place.admin1 : ""}${place.country ? ", " + place.country : ""}`;

  document.getElementById("location").innerText = label;

  const weatherUrl =
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,rain,snowfall,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3`;

  const weatherRes = await fetch(weatherUrl);
  const weatherData = await weatherRes.json();

  const current = weatherData.current;

  document.getElementById("temp").innerText =
    `${Math.round(current.temperature_2m)}°`;

  document.getElementById("details").innerText =
    `Regen: ${current.rain} mm | Schnee: ${current.snowfall} mm | Wind: ${Math.round(current.wind_speed_10m)} km/h`;

  const hintBox = document.getElementById("hintBox");
  const hintTitle = document.getElementById("hintTitle");
  const hintText = document.getElementById("hintText");

  hintBox.className = "hint";

  if (current.snowfall > 0 || current.temperature_2m <= 3) {

    hintBox.classList.add("winter");

    hintTitle.innerText = "❄️ Winterreifen empfohlen";

    hintText.innerText =
      "Kälte oder Schnee: Winterreifen bieten mehr Grip und Sicherheit.";

  } else if (current.temperature_2m < 7) {

    hintBox.classList.add("winter");

    hintTitle.innerText = "⚠️ Unter 7°C";

    hintText.innerText =
      "Winterreifen bleiben bei niedrigen Temperaturen flexibler.";

  } else if (current.rain > 0) {

    hintBox.classList.add("rain");

    hintTitle.innerText = "🌧️ Aquaplaning-Risiko";

    hintText.innerText =
      "Bei Regen auf Profiltiefe und Reifendruck achten.";

  } else {

    hintBox.classList.add("summer");

    hintTitle.innerText = "☀️ Sommerreifen passend";

    hintText.innerText =
      "Gute Bedingungen für Sommerreifen.";

  }

  const forecast = document.getElementById("forecast");

  forecast.innerHTML = "";

  weatherData.daily.time.forEach((day, index) => {

    const item = document.createElement("div");

    item.className = "forecast-item";

    const date = new Date(day).toLocaleDateString("de-DE", {
      weekday: "short"
    });

    item.innerHTML = `
      <div>${date}</div>
      <div>
        ${Math.round(weatherData.daily.temperature_2m_min[index])}°
        /
        ${Math.round(weatherData.daily.temperature_2m_max[index])}°
      </div>
    `;

    forecast.appendChild(item);

  });
}

loadWeather();
</script>

</body>
</html>
